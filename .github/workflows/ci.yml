name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps: 
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Verify vendored pybind11 submodule
        run: |
          test -d extern/pybind11/include/pybind11
          echo "Using vendored pybind11 from extern/pybind11/include"

      - name: Show build configuration
        run: |
          make show-config

      - name: Build and run test
        run: |
          make clean
          make test